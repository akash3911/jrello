services:
  db:
    image: postgres:15-alpine
    container_name: jrello-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jrello
      POSTGRES_PASSWORD: jrellopassword
      POSTGRES_DB: jrello
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jrello -d jrello"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
